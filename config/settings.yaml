# ==============================================================================
# Intelligent Surveillance System (ISS) Configuration
# Optimized for Apple Silicon macOS (MacBook Air)
# ==============================================================================

# Video Stream Settings
stream:
  source: 0                 # 0 for built-in FaceTime HD camera, or RTSP URL
  width: 1280
  height: 720
  fps: 30
  buffer_seconds: 5         # Rolling pre-event history buffer in seconds

# Thermal Guard & Motion Gating (Reduces continuous compute on fanless Mac)
motion:
  enabled: true
  min_motion_area: 1200     # Minimum pixel area to trigger neural inference
  history: 500              # MOG2 history frames
  var_threshold: 25         # MOG2 variance threshold

# Deep Learning Inference (CoreML on Apple Neural Engine / Metal MPS)
detector:
  model_type: "yolo"        # "yolo" or "mock" (for headless testing)
  model_path: "yolo11n.pt"  # CoreML (.mlpackage) or PyTorch (.pt)
  confidence_threshold: 0.45
  idle_scan_seconds: 1.0     # Also scan this often when the scene is still
  min_detection_area: 1500   # Minimum pixel area per detection (filters noise)
  min_person_size: 40        # Min bbox width/height for person class (filters hand false-positives)
  min_person_area: 2000      # Min pixel area for person class detections
  target_classes:
    - 0    # Person
    - 1    # Bicycle
    - 2    # Car
    - 3    # Motorcycle
    - 5    # Bus
    - 7    # Truck
    - 24   # Backpack
    - 26   # Handbag
    - 28   # Suitcase
    - 44   # Knife (THREAT)
    - 56   # Chair
    - 57   # Couch
    - 59   # Bed
    - 60   # Dining table
    - 63   # Laptop (TECH_ASSET)
    - 64   # Mouse (TECH_ASSET)
    - 66   # Keyboard (TECH_ASSET)
    - 67   # Cell phone (TECH_ASSET)
    - 73   # Book
    - 76   # Scissors (THREAT)
    - 77   # Teddy bear

# Multi-Object Tracker
tracker:
  max_disappeared: 30       # Max frames an object can be lost before removing track
  min_iou: 0.3              # Minimum IoU matching threshold

# Spatial Analytics Rules
analytics:
  tripwire:
    enabled: true
    line_start: [100, 360]
    line_end: [1180, 360]
    direction: "both"

  intrusion:
    enabled: true
    polygon:
      - [700, 150]
      - [1150, 150]
      - [1150, 600]
      - [700, 600]

  loitering:
    enabled: true
    max_dwell_seconds: 8.0
    radius_pixels: 60.0

# Alert & Notification Dispatcher
alerts:
  macos_banner: true
  macos_sound: "Hero"
  telegram:
    enabled: false
    token_env: "ISS_TELEGRAM_BOT_TOKEN"
    chat_id_env: "ISS_TELEGRAM_CHAT_ID"

# Video Recording & Archival
recording:
  enabled: true
  output_dir: "recordings"
  post_event_seconds: 8
  codec: "mp4v"
  max_pending_incidents: 1  # One active/coalesced incident at a time
  max_age_days: 14
  max_total_mb: 2048

# Local browser dashboard (open http://localhost:8080 while the pipeline runs)
web_ui:
  enabled: true
  port: 8080
